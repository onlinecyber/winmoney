<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account</title>
  <link rel="stylesheet" href="/css/account.css">
  <link rel="stylesheet" href="/css/skeleton.css">
</head>

<body>

  <div class="account">

    <!-- PREMIUM HEADER -->
    <div class="header-section">
      <div class="user-card">
        <div class="user-info">
          <div class="avatar-wrapper">
            <div class="avatar" id="userAvatar">U</div>
            <span class="status-dot"></span>
          </div>
          <div class="user-details">
            <h3 id="username">User</h3>
            <p id="userId" class="user-id">ID: ------</p>
          </div>
        </div>
        <div class="header-actions">
          <span class="bell" onclick="location.href='/help-center.html'">🔔</span>
        </div>
      </div>

      <!-- VIP BADGE -->
      <div class="vip-badge">
        <span class="vip-icon">👑</span>
        <span class="vip-level">VIP 0</span>
        <div class="vip-progress">
          <div class="vip-bar" id="vipBar"></div>
        </div>
      </div>

      <!-- COMPACT CHECK-IN BADGE -->
      <div class="header-checkin">
        <div class="checkin-compact" id="checkinCompact">
          <span class="checkin-icon">🎁</span>
          <div class="checkin-info">
            <span class="checkin-label">Daily Check-in</span>
            <span class="checkin-streak" id="streakDisplay">🔥 0 days</span>
          </div>
        </div>
      </div>
    </div>


    <!-- LIVE TRANSACTION FEED -->
    <div class="live-feed">
      <div class="feed-ticker" id="feedTicker">
        <span class="feed-item">🎉 Rajesh from Delhi just earned ₹850!</span>
      </div>
    </div>

    <!-- WALLET CARDS -->
    <div class="wallet-section">
      <div class="wallet deposit">
        <div class="wallet-header">
          <span class="wallet-icon">🔐</span>
          <span class="wallet-title">Deposit Balance</span>
        </div>
        <p class="wallet-amount" id="depositBal">₹0.00</p>
        <span class="wallet-subtitle">For investing only</span>
      </div>

      <div class="wallet withdraw">
        <div class="wallet-header">
          <span class="wallet-icon">💸</span>
          <span class="wallet-title">Withdraw Balance</span>
        </div>
        <p class="wallet-amount" id="withdrawBal">₹0.00</p>
        <span class="wallet-subtitle">Daily income & withdrawals</span>
      </div>
    </div>

    <!-- STATS CARDS -->
    <div class="stats-section">
      <div class="stat-card" onclick="location.href='/my-products.html'">
        <div class="stat-value" id="totalInvested">₹0</div>
        <div class="stat-label">Total Invested</div>
      </div>
      <div class="stat-card" onclick="location.href='/income-history.html'">
        <div class="stat-value" id="todayIncome">₹0</div>
        <div class="stat-label">Today's Income</div>
      </div>
    </div>

  </div>

  <!-- FIXED BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
    <a href="/account.html" class="nav-item active">
      <span class="nav-icon">�</span>
      <span class="nav-label">Home</span>
    </a>
    <a href="/bronze.html" class="nav-item">
      <span class="nav-icon">�</span>
      <span class="nav-label">Invest</span>
    </a>
    <a href="/recharge.html" class="nav-item">
      <span class="nav-icon">�</span>
      <span class="nav-label">Wallet</span>
    </a>
    <a href="/income-history.html" class="nav-item">
      <span class="nav-icon">📊</span>
      <span class="nav-label">History</span>
    </a>
    <a href="/invite.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span class="nav-label">Profile</span>
    </a>
  </nav>


  <script src="/js/toast.js"></script>
  <script type="module" src="/js/account.js"></script>
  <script type="module" src="/js/income-engine.js"></script>
</body>

</html>
